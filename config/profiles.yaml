# Investor profiles: "DC budowane" (built) and "DC kontenerowe" (container).
# A profile verdict is a lens on the same site features as the score; it does not change the score.
# Every number below is a practice assumption (see docs/SCORING.md), not a legal value. Tune freely.
# Distances in km or m as named, areas in ha, percentages 0-100.

# Hard filters shared by both profiles: a site is red when more than this share of it overlaps.
hard:
  protected_nature_pct_over: 0   # Natura 2000, national park, reserve
  flood_pct_over: 0              # flood zones Q10 / Q1
  forest_pct_over: 0
  mining_area_pct_over: 0
  heritage_register: true

# Category cut-offs on the 0-100 soft score (no blocker, nothing blocking to check).
thresholds: {green: 70, yellow: 45}

profiles:
  built:
    label_pl: Budowane
    min_area_ha: 10
    zoning_other: block          # zoning kind "other": block | check (container may sit in U, which we cannot tell apart yet)
    housing_m: {full: 400, min: 250}      # nearest house: full points at 'full', zero at or below 'min'
    gpz110_km: {full: 3, zero: 15}
    headroom_mw: {full: 10, zero: 0}      # published DSO headroom at the nearest GPZ (a signal only)
    weights: {housing: 15, gpz110: 20, headroom: 15, soil: 8}
  container:
    label_pl: Kontenerowe
    min_area_ha: 0.15
    zoning_other: check
    housing_m: {full: 150, min: 80}
    gpz110_km: {full: 1, zero: 5}
    headroom_mw: {full: 2, zero: 0}
    weights: {housing: 15, gpz110: 15, headroom: 10, soil: 8}
