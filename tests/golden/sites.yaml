# Golden set (brief section 10). A sanity check, not ground truth: a miss means investigate the filter,
# never tune the scoring to pass.
#
# Coordinates are deliberately empty: they must be researched (press releases, planning documents) and
# verified on Geoportal in Phase 0 before they are used. Do not fill them with guesses.
#
# expect: not_excluded_top20pct  -> must not be hard-excluded and should rank in the top 20% of its powiat
#         excluded_too_small     -> must be excluded with the reason "za mała powierzchnia"

sites:
  - name: Hillwood Reguły
    expect: not_excluded_top20pct
    capacity_mw: 130
    area_ha: [22, 40]
    lon: null
    lat: null
    verified_on_geoportal: false
    location_note: "Reguły, gmina Michałowice (SW of Warsaw), between Aleje Jerozolimskie and the WKD line; 4 buildings, 130 MW total. Sources disagree on area: >22 ha (developer) vs 40 ha (directory). Residents dispute zoning compliance."
    # Unverified village-centre candidate (not the plot). Used by nothing until verified on Geoportal.
    candidate:
      lon: 20.863056
      lat: 52.173889
      what: "village centre of Reguły, SIMC 0005300"
      source: "https://www.polskawliczbach.pl/wies_Reguly"
    # Parcel candidates (ULDK, obręb 0013 Reguły). Not the plot: the 40 ha site may be several parcels, and the
    # likely planning document is the MPZP "Regulska" (about 39 ha, between Al. Jerozolimskie, ul. Regulska and the WKD line).
    candidate_parcels:
      - {id: "142104_2.0013.408", area_m2: 17692, note: "plan boundary: south edge of plot"}
      - {id: "142104_2.0013.409", area_m2: 2188, note: "plan boundary: south edge of plot"}
      - {id: "142104_2.0013.562/2", area_m2: 43000, note: "mid-size parcel in the plan area (approx.)"}
      - {id: "142104_2.0013.562/3", area_m2: 43000, note: "mid-size parcel in the plan area (approx.)"}
      - {id: "142104_2.0013.562/4", area_m2: 43000, note: "mid-size parcel in the plan area (approx.)"}
      - {id: "142104_2.0013.564/2", area_m2: 23000, note: "mid-size parcel in the plan area (approx.)"}
      - {id: "rejected: 402/1", area_m2: 1156, note: "listing says 9050 m2; ULDK says 1156 m2, rejected"}
      - {id: "unconfirmed: 631/23, 631/30, 628/23", note: "probably road or rail corridors; not confirmed"}
    uldk_check: "ULDK GetParcelByXY (WGS84), 11.10.2026: commune Michałowice, powiat pruszkowski, mazowieckie. Commune only, not the plot."
    sources: ["https://eurobuildcee.com/en/news/37149-hillwood-moves-planned-data-centre-further-from-homes"]

